name: Release

# 打 v* 标签即自动构建签名并发布 Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 生成托盘资产（3204 张功率图）
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python scripts/gen-tray-assets.py

      - name: 导入签名证书
        run: |
          echo "$CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci ci.keychain-db
          security unlock-keychain -p ci ci.keychain-db
          security import /tmp/cert.p12 -k ci.keychain-db -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain-db
          security list-keychains -d user -s ci.keychain-db login.keychain-db
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PWD: ${{ secrets.CERT_PWD }}

      - name: 构建前端 + 打包签名 + 发布到 Release
        run: npm run build && npx electron-builder --mac --publish always
        env:
          CSC_LINK: /tmp/cert.p12
          CSC_KEY_PASSWORD: ${{ secrets.CERT_PWD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
