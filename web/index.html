<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小电拼 2993 · 充电管家</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    window.__errors = [];
    window.addEventListener('error', (e) => { window.__errors.push(e.message); document.title = 'ERR: ' + window.__errors.join(' | ').slice(0, 300); });
    window.addEventListener('unhandledrejection', (e) => { window.__errors.push('promise: ' + (e.reason?.message || e.reason)); document.title = 'ERR: ' + window.__errors.join(' | ').slice(0, 300); });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
